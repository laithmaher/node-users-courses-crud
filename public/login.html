<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #111827;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .alert {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .alert.show {
            display: block;
        }

        button.main {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button.main:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        button.logout {
            background: #dc2626;
        }

        #welcomeView {
            text-align: center;
            display: none;
        }

        #welcomeView p {
            font-size: 22px;
            margin-bottom: 24px;
            color: #111827;
        }
    </style>
</head>

<body>
    <div class="card">

        <!-- شكل الـ Login -->
        <div id="loginView">
            <h1>تسجيل الدخول</h1>
            <div id="serverError" class="alert"></div>
            <form id="loginForm">
                <div class="field">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                        required />
                </div>
                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="0123456789" required minlength="6" />
                </div>
                <button type="submit" class="main" id="submitBtn">دخول</button>
                <a href="/signup.html">مفيش حساب؟ سجّل</a>
            </form>
        </div>

        <!-- شكل الـ Welcome -->
        <div id="welcomeView">
            <p>أهلاً بيك، <strong id="userName"></strong>👋</p>
            <button class="main logout" id="logoutBtn">تسجيل الخروج</button>
        </div>

    </div>

    <script>
        const API_URL = "http://localhost:5000/users/login";

        const loginView = document.getElementById("loginView");
        const welcomeView = document.getElementById("welcomeView");
        const userName = document.getElementById("userName");
        const serverError = document.getElementById("serverError");
        const submitBtn = document.getElementById("submitBtn");




        function showWelcome(name) {
            userName.textContent = name;
            loginView.style.display = "none";
            welcomeView.style.display = "block";
        }

        function showLogin() {
            welcomeView.style.display = "none";
            loginView.style.display = "block";
        }

        // لو اليوزر مسجل دخول قبل كده
        if (localStorage.getItem("token")) {
            showWelcome(localStorage.getItem("token") || "");
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            serverError.classList.remove("show");
            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الدخول...";

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value,
                    }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || "بيانات الدخول غير صحيحة");

                localStorage.setItem("token", data.token);
                localStorage.setItem("name", data.name);
                e.target.reset();
                showWelcome(data.name);
            } catch (err) {
                serverError.textContent = err.message || "حصل خطأ، حاول تاني";
                serverError.classList.add("show");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "دخول";
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("token");
            localStorage.removeItem("name");
            showLogin();
        });
    </script>
</body>

</html>
